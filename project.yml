name: CodexPlusBar
configs:
  Debug: debug
  Release: release
  CloudDevelopment: debug
  CloudProduction: release
options:
  deploymentTarget:
    macOS: 14.0
settings:
  base:
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

schemes:
  CodexPlusBar-CloudDevelopment:
    build:
      targets:
        CodexPlusBar: all
    run:
      config: CloudDevelopment
    archive:
      config: CloudDevelopment
  CodexPlusBar-CloudProduction:
    build:
      targets:
        CodexPlusBar: all
    run:
      config: CloudProduction
    archive:
      config: CloudProduction
  CodexPlusBar:
    shared: true
    build:
      targets:
        CodexPlusBar: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodexPlusBarTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  CodexPlusBar:
    type: application
    platform: macOS
    bundleId: com.linda.CodexPlusBar
    sources:
      - path: Sources
        type: group
        excludes:
          - Info.plist
      - path: Resources
        type: group
        buildPhase: resources
        excludes:
          - AppIcon.icon
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.linda.CodexPlusBar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 24
        MARKETING_VERSION: 1.7.1
      configs:
        CloudDevelopment:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: 2Z8N5KTWQZ
          PROVISIONING_PROFILE_SPECIFIER: CodexPlusBar macOS Development CloudKit
          CODE_SIGN_ENTITLEMENTS: Config/CloudSync-Development.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_APP_SANDBOX: NO
        CloudProduction:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          DEVELOPMENT_TEAM: 2Z8N5KTWQZ
          PROVISIONING_PROFILE_SPECIFIER: CodexPlusBar Developer ID CloudKit
          CODE_SIGN_ENTITLEMENTS: Config/CloudSync-Production.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_APP_SANDBOX: NO

  CodexPlusBarTests:
    type: bundle.unit-test
    platform: macOS
    bundleId: com.linda.CodexPlusBar.Tests
    sources:
      - path: Tests
        type: syncedFolder
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.linda.CodexPlusBar.Tests
    dependencies:
      - target: CodexPlusBar
